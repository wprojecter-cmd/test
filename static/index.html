<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Request Lab</title><style>
body{font:16px system-ui;background:#0a1020;color:#edf3ff;max-width:1000px;margin:32px auto;padding:0 16px}section{background:#111b2e;border:1px solid #263650;border-radius:12px;padding:16px;margin:16px 0}input,button{padding:10px;border-radius:8px}input{width:70%;background:#0b1323;color:white;border:1px solid #263650}button{cursor:pointer;background:#7c9cff;border:0;font-weight:bold}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#070c16;padding:14px;border-radius:8px;max-height:440px;overflow:auto;color:#cfe0ff}.muted{color:#9aaac3}</style></head><body>
<h1>Request Lab</h1><p class="muted">Учебный тест: создаём объект для просмотра, очищаем его и отправляем пустое тело на тестовый endpoint этого приложения.</p>
<section><label for="label">Метка примера </label><input id="label" value="WorldGame-Test"><button id="run">Запустить тест</button><p id="status">Готово</p></section>
<section><h2>Логи</h2><button id="clear">Очистить</button><pre id="logs">Панель запущена. Внешние сервисы не вызываются.</pre></section>
<section><h2>Предпросмотр</h2><pre id="preview">Нажми «Запустить тест».</pre></section>
<section><h2>HTTP-ответ</h2><pre id="response">Ответ появится здесь.</pre></section>
<script>
const el=id=>document.getElementById(id);
const log=s=>el("logs").textContent+="\n["+new Date().toLocaleTimeString()+"] "+s;
el("clear").onclick=()=>el("logs").textContent="[логи очищены]";
el("run").onclick=async()=>{
 const b=el("run");b.disabled=true;
 try{
  log("Подготовка примера.");
  const a=await fetch("/api/demo-mutation",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({label:el("label").value})});
  const d=await a.json();if(!a.ok)throw Error("HTTP "+a.status);
  el("preview").textContent=JSON.stringify({preview_before_clear:d.request_preview,REQUEST_after_clear:d.outbound_body,request_cleared:d.request_cleared,outbound_body_length:d.outbound_body_length},null,2);
  log('REQUEST очищен: "".');
  log("Отправляем пустое тело на /api/empty-body-test.");
  const r=await fetch("/api/empty-body-test",{method:"POST",headers:{"Content-Type":"text/plain"},body:""});
  const x=await r.json();el("response").textContent=JSON.stringify({http_status:r.status,result:x},null,2);
  log("Ответ тестового endpoint: HTTP "+r.status+". Получено байт: "+x.received_body_length+".");
  el("status").textContent=x.body_is_empty?"Успех: тело пустое.":"Тело не пустое.";
 }catch(e){log("Ошибка: "+e.message);el("status").textContent="Ошибка"}
 finally{b.disabled=false}
};
</script></body></html>
